[workspace]
members = ["linux-update-installer", "plvs-cli"]
exclude = ["vendor/voice_activity_detector", "vendor/tauri-plugin-updater"]
resolver = "2"

[workspace.package]
version = "0.23.4"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[package]
name = "plvs"
version.workspace = true
description = "PLVS — real-time audio metering (Tauri desktop shell)"
authors = ["SounDoer"]
license.workspace = true
repository = "https://github.com/SounDoer/PLVS"
edition.workspace = true
rust-version.workspace = true
default-run = "plvs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "plvs"
path = "src/main.rs"

[features]
# Off by default. `npm run desktop:dev` and `desktop:dev-optimized` enable it alongside
# `--config src-tauri/tauri.dev.conf.json`, so build.rs reads the app identifier from the same
# overlay Tauri does. See the comment on `emit_app_id` in build.rs.
dev-identity = []
# Installable test packages use an identity isolated from both local development and stable PLVS.
# The feature also compiles the updater out of Preview builds.
preview-identity = []
# Repository-owned real capture verification. Production bundles never enable this.
capture-harness = ["dep:hound"]
# Manual release-profile crash verification only. Shipping commands must never enable this.
crash-test = []

[build-dependencies]
cc = "1.2.61"
serde_json = "1.0"
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# float_roundtrip: the default fast float parser can move the last digit, which changes
# persisted Theme documents and their portable identity after a single save.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde = { version = "1.0", features = ["derive"] }
semver = "1"
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2.4.3"
tauri-plugin-log = "2"
cpal = "0.18.1"
realfft = "3.4.0"
rustfft = "6.2.0"
sha2 = "0.11"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
voice_activity_detector = { path = "vendor/voice_activity_detector" }
rubato = "5.0"
# Pin: time 0.3.48 breaks a trait-coherence check in tauri-utils/cookie. The pre-commit hook
# regenerates Cargo.lock (`cargo generate-lockfile`) whenever Cargo.toml changes, which would
# otherwise keep re-bumping time to the broken release. The `=` constraint makes the pin stick.
time = { version = "=0.3.55", features = ["formatting"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
firered-vad = "0.1.0"
ort = { version = "=2.0.0-rc.12", default-features = false }
futures-util = "0.3"
fs4 = { version = "1.1.0", features = ["sync"] }
crossbeam-queue = "0.3.13"
atomic-write-file = "0.3.1"
getrandom = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
subtle = "2.6.1"
tauri-plugin-clipboard-manager = "2.3.3"
hound = { version = "3.5.1", optional = true }

# Glass is macOS-only (see glass_effect.rs) — Windows has no compatible blur mechanism for a
# per-pixel-transparent window, so this dependency isn't needed on that target at all.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
window-vibrancy = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18.5", features = ["png"] }
cpal = { version = "0.18.1", features = ["pulseaudio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.9.0"
pulseaudio = "0.3"
futures = "0.3"
libc = "0.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
webview2-com = "0.39.1"
windows-capture = "2.0.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }
windows-core = "0.62.2"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Size-focused release profile (the Tauri template defaults this project was missing).
# opt-level stays at the default 3: the DSP hot path should keep full speed optimization.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Capture smoke/soak harness (`--features capture-harness`). A separate profile gives it
# target/harness/, so it never replaces the dev-identity GUI in target/release/.
[profile.harness]
inherits = "release"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "spectral_fft_count"
harness = false

[[bench]]
name = "vectorscope"
harness = false

[[bench]]
name = "stereo_map"
harness = false
