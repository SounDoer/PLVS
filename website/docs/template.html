<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLVS Docs</title>
    <meta
      name="description"
      content="How to use PLVS: signal sources, meter panels, workspace, and settings."
    />
    <link rel="stylesheet" href="../assets/site-chrome.css" />
    <link rel="stylesheet" href="../assets/docs.css" />
    <link rel="stylesheet" href="../assets/back-to-top.css" />
    <script type="module">
      import { enhanceSiteNavigation } from "../assets/site-navigation.js";
      import { enhanceBackToTop } from "../assets/back-to-top.js";
      enhanceSiteNavigation(document.querySelector("[data-site-navigation]"));
      enhanceBackToTop();
    </script>
  </head>
  <body class="site-background">
    <!-- SITE_NAVIGATION -->

    <div class="docs-layout">
      <nav class="docs-sidebar" aria-label="Docs sections">
        <!-- USER_DOCS_SIDEBAR -->
      </nav>

      <main class="docs-content">
        <header class="docs-header">
          <h1>Docs</h1>
          <p>Get started with PLVS and explore its sources, meters, and workspace.</p>
        </header>
        <!-- USER_DOCS_CONTENT -->
      </main>
    </div>

    <script>
      const sections = document.querySelectorAll(".docs-section");
      const links = document.querySelectorAll(".docs-sidebar a");

      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            for (const link of links) {
              const active = link.getAttribute("href") === `#${entry.target.id}`;
              link.classList.toggle("active", active);
              if (active) link.setAttribute("aria-current", "location");
              else link.removeAttribute("aria-current");
            }
          }
        },
        { rootMargin: "-40% 0px -50% 0px" }
      );

      for (const section of sections) observer.observe(section);
    </script>
  </body>
</html>
