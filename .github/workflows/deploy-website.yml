name: Deploy Website

# release.yml dispatches this with the published tag. Both publication paths protect live history.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Released tag to deploy the website and Sharesets content from
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/publish-site.yml
    with:
      site_ref: ${{ inputs.ref }}
