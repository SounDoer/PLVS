name: Deploy Website

# release.yml dispatches the stable tag after publication.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Published stable PLVS tag or exact commit (main selects the latest stable release)
        required: true
        default: main
      website_ref:
        description: Exact PLVS-Website SHA with successful push CI (empty keeps the live site source)
        type: string
      policy_ref:
        description: Exact PLVS privacy policy commit when publishing an independent policy update
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/publish-site.yml
    with:
      product_ref: ${{ inputs.ref }}
      website_ref: ${{ inputs.website_ref }}
      policy_ref: ${{ inputs.policy_ref }}
