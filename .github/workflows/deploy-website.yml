name: Deploy Website

# release.yml dispatches this with the published tag. Both publication paths protect live history.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact website commit SHA (or stable release tag); successful push CI required
        required: true
        default: main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Require successful CI for the exact website commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_REF: ${{ inputs.ref }}
        run: node scripts/website-publication.mjs gate
  deploy:
    needs: validate
    uses: ./.github/workflows/publish-site.yml
    with:
      site_ref: ${{ needs.validate.outputs.sha }}
