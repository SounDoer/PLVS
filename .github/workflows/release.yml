# Windows installer (NSIS) + portable ZIP; macOS installer (DMG, Apple Silicon).
#
# A release is dispatched for an exact commit after its normal CI run succeeds. Each platform is
# built and smoke-tested once. The tested files are then assembled in a draft GitHub Release and
# published together, so immutable releases never expose or lock a partial set of assets.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver without the leading v (for example, 0.17.0)
        required: true
        type: string
      commit_sha:
        description: Full commit SHA at the tip of main to release
        required: true
        type: string
      confirm_immutable_releases:
        description: I verified that repository release immutability is enabled
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      IMMUTABILITY_CONFIRMED: ${{ inputs.confirm_immutable_releases }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release inputs
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be semver without a leading v" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "$IMMUTABILITY_CONFIRMED" != "true" ]]; then
            echo "Confirm repository release immutability before dispatching" >&2
            exit 1
          fi

          remote_main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$remote_main" != "$RELEASE_SHA" ]]; then
            echo "commit_sha is not the current tip of origin/main" >&2
            echo "expected: $remote_main" >&2
            echo "received: $RELEASE_SHA" >&2
            exit 1
          fi

      - name: Require successful CI for the exact commit
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --event push \
            --commit "$RELEASE_SHA" \
            --limit 1 \
            --json conclusion,status \
            --jq '.[0] | select(.status == "completed") | .conclusion')
          if [[ "$conclusion" != "success" ]]; then
            echo "The exact commit does not have a successful completed ci.yml push run" >&2
            exit 1
          fi

      - name: Refuse an existing tag or release
        run: |
          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Remote tag ${tag} already exists" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists" >&2
            exit 1
          fi

      - name: Checkout the exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Verify version and changelog
        run: |
          node scripts/verify-versions.mjs
          actual=$(node -p "require('./package.json').version")
          if [[ "$actual" != "$VERSION" ]]; then
            echo "package version ${actual} does not match requested version ${VERSION}" >&2
            exit 1
          fi
          node scripts/changelog-release-body.mjs "v${VERSION}" release-notes.md

  build-windows:
    needs: validate
    runs-on: windows-latest
    env:
      TAG: v${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install dependencies
        run: npm ci

      - name: Smoke test file analysis with FFmpeg sidecars
        run: npm run smoke:file-analysis

      - name: Build frontend (Vite)
        run: npm run build

      - name: Build Tauri bundle (NSIS + release binaries for portable)
        run: npm run desktop:release-nsis

      - name: Smoke test Windows installer
        run: npm run desktop:verify-windows-installer

      - name: Stage tested Windows release candidate
        shell: pwsh
        run: |
          $candidateDir = "release-candidate/windows"
          $assetDir = "$candidateDir/release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          $installerName = "PLVS_$($env:VERSION)_x64-setup.exe"
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/$installerName"
          Copy-Item $installer.FullName "$assetDir/$installerName"

          $portableDir = "PLVS-$env:TAG-x64-portable"
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          foreach ($name in @("plvs.exe", "plvs-cli.exe", "ffmpeg.exe", "ffprobe.exe")) {
            $src = "src-tauri/target/release/$name"
            if (!(Test-Path $src)) { throw "Missing $src" }
            Copy-Item $src "$portableDir/$name"
          }
          node scripts/stage-license-assets.mjs $portableDir
          node scripts/verify-license-assets.mjs $portableDir
          Compress-Archive -Path "$portableDir\*" -DestinationPath "$assetDir/$portableDir.zip"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-portable.ps1 `
            -ZipPath "$assetDir/$portableDir.zip"

          $signatureFile = Get-Item "$($installer.FullName).sig"
          $descriptor = @{
            platform  = "windows-x86_64"
            url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$installerName"
            signature = (Get-Content $signatureFile.FullName -Raw).Trim()
          }
          $descriptor | ConvertTo-Json | Set-Content "$candidateDir/updater-windows.json"

      - name: Upload tested Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-windows
          path: release-candidate/windows/
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: validate
    runs-on: macos-latest
    env:
      TAG: v${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install dependencies
        run: npm ci

      - name: Smoke test file analysis with FFmpeg sidecars
        run: npm run smoke:file-analysis

      - name: Build Tauri bundle (DMG)
        run: npm run desktop:release-dmg

      - name: Smoke test macOS DMG
        run: npm run desktop:verify-macos-dmg

      - name: Stage tested macOS release candidate
        run: |
          candidate_dir="release-candidate/macos"
          asset_dir="$candidate_dir/release-assets"
          mkdir -p "$asset_dir"

          dmg=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          cp "$dmg" "$asset_dir/PLVS-${TAG}-aarch64.dmg"

          signature_file=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz.sig' -print -quit)
          test -n "$signature_file"
          tarball="${signature_file%.sig}"
          cp "$tarball" "$asset_dir/PLVS.app.tar.gz"

          signature=$(cat "$signature_file")
          node -e "
            const fs = require('fs');
            fs.writeFileSync(process.argv[1], JSON.stringify({
              platform: 'darwin-aarch64',
              url: 'https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PLVS.app.tar.gz',
              signature: process.argv[2],
            }));
          " "$candidate_dir/updater-macos.json" "$signature"

      - name: Upload tested macOS candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-macos
          path: release-candidate/macos/
          if-no-files-found: error
          retention-days: 7

  prepare-draft:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
      TAG: v${{ inputs.version }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Download Windows candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-windows
          path: candidates/windows

      - name: Download macOS candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-macos
          path: candidates/macos

      - name: Assemble and validate the complete release
        run: |
          mkdir release-assets
          cp candidates/windows/release-assets/* release-assets/
          cp candidates/macos/release-assets/* release-assets/
          node scripts/changelog-release-body.mjs "$TAG" release-notes.md
          node scripts/changelog-release-body.mjs "$TAG" updater-notes.md --changelog-cumulative
          node scripts/build-updater-manifest.mjs \
            "$VERSION" \
            updater-notes.md \
            release-assets/latest.json \
            candidates/windows/updater-windows.json \
            candidates/macos/updater-macos.json
          node scripts/validate-release-bundle.mjs "$VERSION" release-assets

      - name: Create complete draft release
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Verify the draft before approval
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$draft" != "true" ]]; then
            echo "${TAG} was not created as a draft" >&2
            exit 1
          fi

          target_commitish=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish \
            --jq .targetCommitish)
          if [[ "$target_commitish" != "$RELEASE_SHA" ]]; then
            echo "Draft ${TAG} does not target the requested commit" >&2
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets | map(.name) | sort | .[]' > uploaded-assets.txt
          diff --unified expected-assets.txt uploaded-assets.txt

          empty_assets=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[] | select(.size == 0)] | length')
          if [[ "$empty_assets" != "0" ]]; then
            echo "The draft contains an empty asset" >&2
            exit 1
          fi

  publish-release:
    needs: prepare-draft
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.commit_sha }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Revalidate source and draft
        run: |
          remote_main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$remote_main" != "$RELEASE_SHA" ]]; then
            echo "origin/main moved after the release candidate was built" >&2
            exit 1
          fi

          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$draft" != "true" ]]; then
            echo "${TAG} is not an unpublished draft" >&2
            exit 1
          fi

          target_commitish=$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish \
            --jq .targetCommitish)
          if [[ "$target_commitish" != "$RELEASE_SHA" ]]; then
            echo "Draft ${TAG} moved away from the tested commit" >&2
            exit 1
          fi

      - name: Publish the immutable release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify immutability and release attestation
        run: |
          immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .immutable)
          if [[ "$immutable" != "true" ]]; then
            echo "Published release is not immutable. Enable release immutability before dispatching." >&2
            exit 1
          fi

          for attempt in {1..12}; do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Release attestation was not verifiable after one minute" >&2
              exit 1
            fi
            sleep 5
          done

  deploy-landing:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ inputs.version }}
    steps:
      - name: Dispatch the website deployment for the published tag
        run: gh workflow run deploy-landing.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$TAG"
