name: Deploy Landing Page

# release.yml dispatches this with the published tag. Both publication paths protect live history.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Released tag to deploy the website and Sharesets content from
        required: true
        default: main
      bootstrap_sharesets:
        description: First publication only; verify the legacy empty Catalogue before creating its marker
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/publish-site.yml
    with:
      site_ref: ${{ inputs.ref }}
      bootstrap_sharesets: ${{ inputs.bootstrap_sharesets }}
