name: Deploy Landing Page

# Runs when release.yml dispatches it after a version is published, or by hand. It deploys the
# website from the given ref, so the site never describes changes that have not been released.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy the website from
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Build the site with the user guide
        run: |
          cp -r landing _site
          node scripts/build-user-docs.mjs _site/docs/index.html
          rm _site/docs/template.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v5
