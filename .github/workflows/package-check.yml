name: Package Check

on:
  workflow_call:
    inputs:
      windows:
        type: boolean
        default: false
      macos:
        type: boolean
        default: false
      linux:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: Package platform to check
        type: choice
        options: [all, windows, macos, linux]
        default: all
  schedule:
    # The path classifier provides fast feedback; this full run catches omissions in that table.
    - cron: "30 17 * * 0"

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: >-
      inputs.windows ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows'))
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup toolchain install --no-self-update
      - run: npm ci
      - name: Build non-publishing Windows package candidate
        run: npm run desktop:check-nsis
      - name: Record candidate identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package-check-evidence | Out-Null
          $candidate = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $candidate) { throw "NSIS candidate was not produced" }
          Get-FileHash -Algorithm SHA256 $candidate.FullName |
            Select-Object Algorithm, Hash, Path |
            ConvertTo-Json | Set-Content package-check-evidence/candidate.json
      - name: Install and verify the Windows package
        run: npm run desktop:verify-stable-nsis
      - name: Upload Windows package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-check-windows
          path: package-check-evidence/
          if-no-files-found: warn
          retention-days: 7

  macos:
    if: >-
      inputs.macos ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos'))
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup toolchain install --no-self-update
      - run: npm ci
      - name: Build unsigned non-publishing macOS package candidate
        run: npm run desktop:check-dmg
      - name: Record candidate identity
        shell: bash
        run: |
          mkdir -p package-check-evidence
          candidates=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ ${#candidates[@]} == 1 && -f "${candidates[0]}" ]]
          shasum -a 256 "${candidates[0]}" > package-check-evidence/candidate.sha256
      - name: Mount and verify the macOS package
        run: npm run desktop:verify-check-dmg
      - name: Upload macOS package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-check-macos
          path: package-check-evidence/
          if-no-files-found: warn
          retention-days: 7

  linux:
    if: >-
      inputs.linux ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'linux'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup toolchain install --no-self-update
      - name: Install package build and clean-system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            debootstrap
      - run: npm ci
      - name: Build non-publishing Ubuntu package candidate
        run: npm run desktop:stable-deb
      - name: Verify the package in a fresh Ubuntu userspace
        shell: bash
        run: |
          candidates=(src-tauri/target/release/bundle/deb/*.deb)
          [[ ${#candidates[@]} == 1 && -f "${candidates[0]}" ]]
          mkdir -p package-check-evidence
          sha256sum "${candidates[0]}" > package-check-evidence/candidate.sha256
          node scripts/generate-sidecar-fixtures.mjs \
            "$PWD/linux-sidecar-fixtures" \
            "$PWD/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu"
          sudo bash scripts/verify-linux-deb-clean.sh \
            "${candidates[0]}" "$PWD/package-check-evidence" "$PWD/linux-sidecar-fixtures"
      - name: Upload Ubuntu package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-check-linux
          path: package-check-evidence/
          if-no-files-found: warn
          retention-days: 7
