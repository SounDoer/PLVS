name: Publish Validated Site

on:
  workflow_call:
    inputs:
      site_ref:
        description: Website ref; empty selects the latest stable Release
        type: string
        default: ""
      content_ref:
        description: Content ref; empty uses the exact website commit
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Hold one shared lock from baseline discovery through deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve website ref
        id: website
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_REF: ${{ inputs.site_ref }}
        run: |
          if [ -z "$SITE_REF" ]; then
            SITE_REF=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          echo "ref=$SITE_REF" >> "$GITHUB_OUTPUT"
      - name: Check out website code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.website.outputs.ref }}
          path: site-source
      - name: Resolve exact content ref
        id: content
        env:
          CONTENT_REF: ${{ inputs.content_ref }}
        run: |
          if [ -z "$CONTENT_REF" ]; then CONTENT_REF=$(git -C site-source rev-parse HEAD); fi
          echo "ref=$CONTENT_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version-file: site-source/.nvmrc
          cache: npm
          cache-dependency-path: site-source/package-lock.json
      - name: Resolve the published content baseline
        id: baseline
        run: node site-source/scripts/sharesets-publication.mjs resolve site-source/website/CNAME
      - name: Check out published Sharesets content
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.baseline.outputs.ref }}
          path: published-content-source
          sparse-checkout: sharesets/catalogue
      - name: Check out candidate Sharesets content
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.content.outputs.ref }}
          path: content-source
          sparse-checkout: sharesets/catalogue
      - name: Install the website toolchain
        working-directory: site-source
        run: npm ci
      - name: Validate immutable Sharesets history
        run: node site-source/scripts/sharesets-catalogue-update.mjs published-content-source/sharesets/catalogue content-source/sharesets/catalogue
      - name: Assemble the website and record its content identity
        run: |
          (cd site-source && node scripts/build-website.mjs ../content-source/sharesets/catalogue ../_site)
          candidate_sha=$(git -C content-source rev-parse HEAD)
          node site-source/scripts/sharesets-publication.mjs write _site/sharesets/publication.json "$candidate_sha"
          export WEBSITE_SHA=$(git -C site-source rev-parse HEAD)
          export CONTENT_SHA="$candidate_sha"
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("_site/publication.json", JSON.stringify({schemaVersion:1,repository:process.env.GITHUB_REPOSITORY,websiteSha:process.env.WEBSITE_SHA,contentSha:process.env.CONTENT_SHA}, null, 2) + "\n");'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live website identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export WEBSITE_SHA=$(git -C site-source rev-parse HEAD)
          export CONTENT_SHA=$(git -C content-source rev-parse HEAD)
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          const url = new URL('publication.json', process.env.PAGE_URL);
          let failure;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              url.searchParams.set('verify', `${Date.now()}`);
              const response = await fetch(url, { signal: AbortSignal.timeout(15000), headers: { 'Cache-Control': 'no-cache' } });
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              const marker = await response.json();
              if (marker.schemaVersion !== 1 || marker.repository !== process.env.GITHUB_REPOSITORY ||
                  marker.websiteSha !== process.env.WEBSITE_SHA || marker.contentSha !== process.env.CONTENT_SHA) {
                throw new Error('Live website identity does not match the deployed artifact');
              }
              console.log(`Verified live website ${marker.websiteSha}`);
              process.exit(0);
            } catch (error) { failure = error; }
            if (attempt < 5) await setTimeout(5000);
          }
          throw failure;
          NODE
