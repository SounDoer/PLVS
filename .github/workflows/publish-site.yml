name: Publish Validated Site

on:
  workflow_call:
    inputs:
      product_ref:
        type: string
        default: ""
      website_ref:
        type: string
        default: ""
      content_ref:
        type: string
        default: ""
      policy_ref:
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve and verify publication inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_REF: ${{ inputs.product_ref }}
          WEBSITE_SOURCE_REF: ${{ inputs.website_ref }}
          CONTENT_REF: ${{ inputs.content_ref }}
          POLICY_REF: ${{ inputs.policy_ref }}
        run: node scripts/resolve-website-deployment.mjs
      - uses: actions/checkout@v7
        with:
          repository: SounDoer/PLVS-Website
          ref: ${{ steps.plan.outputs.siteSha }}
          path: artifacts/site-source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.productSha }}
          path: artifacts/product-source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.policySha }}
          path: artifacts/policy-source
          sparse-checkout: |
            docs/privacy-review.json
            website/privacy/index.html
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.baselineSha }}
          path: artifacts/published-content-source
          sparse-checkout: sharesets/catalogue
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.contentSha }}
          path: artifacts/content-source
          sparse-checkout: sharesets/catalogue
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: artifacts/site-source
      - name: Validate immutable Sharesets history
        run: |
          (cd artifacts/product-source && node scripts/sharesets-catalogue-update.mjs ../published-content-source/sharesets/catalogue ../content-source/sharesets/catalogue)
      - name: Export reviewed inputs and build the site
        run: |
          node scripts/export-website-inputs.mjs artifacts/product-source artifacts/site-inputs artifacts/content-source artifacts/policy-source
          (cd artifacts/site-source && npm run build -- ../site-inputs ../../_site)
          cmp website/CNAME _site/CNAME
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { validatePrivacyReview } from "./scripts/privacy-review.mjs";
          const record = JSON.parse(readFileSync("artifacts/policy-source/docs/privacy-review.json", "utf8"));
          const errors = validatePrivacyReview(readFileSync("_site/privacy/index.html", "utf8"), record);
          if (errors.length) throw new Error(errors.join("\n"));
          NODE
          node scripts/sharesets-publication.mjs write _site/sharesets/publication.json "${{ steps.plan.outputs.contentSha }}"
      - name: Record exact publication identities
        env:
          PRODUCT_SHA: ${{ steps.plan.outputs.productSha }}
          WEBSITE_SOURCE_SHA: ${{ steps.plan.outputs.siteSha }}
          CONTENT_SHA: ${{ steps.plan.outputs.contentSha }}
          POLICY_SHA: ${{ steps.plan.outputs.policySha }}
        run: node scripts/website-deployment-marker.mjs write _site/publication.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live website identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/website-deployment-marker.mjs verify _site/publication.json "$PAGE_URL"
