name: Deploy Sharesets Content

on:
  workflow_dispatch:
    inputs:
      content_ref:
        description: Content commit to publish against the live website source and latest stable product
        required: true
        default: main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/publish-site.yml
    with:
      content_ref: ${{ inputs.content_ref }}
