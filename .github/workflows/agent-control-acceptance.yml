# Developer Agent Control acceptance on the real desktop rigs. Stable package smoke remains
# in release-package-smoke.yml. The public artifact contains statuses only.
name: Agent Control Acceptance

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA to verify
        required: true
        type: string
      platform:
        description: Desktop platforms to verify
        type: choice
        default: all
        options: [all, windows, macos, linux]
      scenario:
        description: Desktop acceptance suite or Live source reconnect on the Windows and Linux rigs
        type: choice
        default: desktop
        options: [desktop, live-source-reconnect]

permissions:
  contents: read

concurrency:
  group: agent-control-acceptance-${{ inputs.scenario }}-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  agent-control:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'all' && (inputs.scenario == 'live-source-reconnect' && fromJSON('["windows","linux"]') || fromJSON('["windows","macos","linux"]')) || fromJSON(format('["{0}"]', inputs.platform)) }}
    runs-on: [self-hosted, plvs-rig, "${{ matrix.platform }}"]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      COREPACK_ENABLE_AUTO_PIN: 0
    steps:
      - name: Validate the commit
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout the exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit on main
        run: |
          if ! git merge-base --is-ancestor "$COMMIT_SHA" refs/remotes/origin/main; then
            echo "commit_sha is not reachable from main" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install dependencies
        run: npm ci

      - name: Build the dev app and CLI
        run: |
          npm run ffmpeg:fetch
          npm run cli:build -- --profile debug --identity dev --stage
          export TAURI_CONFIG="$(node -p 'JSON.stringify(require("./src-tauri/tauri.dev.conf.json"))')"
          cargo build --manifest-path src-tauri/Cargo.toml --locked --bin plvs \
            --no-default-features --features dev-identity --target-dir src-tauri/target/dev-identity

      - name: Run desktop acceptance
        if: inputs.scenario == 'desktop'
        run: |
          args=(node scripts/run-agent-control-acceptance.mjs
            "artifacts/agent-control-workflow/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          if [[ "$RUNNER_OS" == macOS ]]; then
            caffeinate -d -i "${args[@]}"
          else
            "${args[@]}"
          fi

      - name: Run Live source reconnect smoke
        if: inputs.scenario == 'live-source-reconnect'
        run: |
          node scripts/smoke-live-source-reconnect.mjs \
            "artifacts/agent-control-workflow/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Restore the Windows test endpoint
        if: ${{ always() && inputs.scenario == 'live-source-reconnect' && matrix.platform == 'windows' }}
        timeout-minutes: 3
        run: |
          output="artifacts/agent-control-workflow/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -f "$output/windows-endpoint.json" ]]; then
            node scripts/smoke-live-source-reconnect.mjs "$output" --restore-windows
          fi

      - name: Upload Agent Control summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-control-evidence-${{ matrix.platform }}
          path: artifacts/agent-control-workflow/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
          if-no-files-found: warn
          retention-days: 14
